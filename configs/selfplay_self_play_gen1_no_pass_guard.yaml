# All fixes combined: root noise excluding Pass (alpha=0.1) + temperature annealing +
# a hard structural guarantee against the Pass-collapse pattern (2026-09-05, see
# docs/SELF_PLAY_STABILITY.md section 17): no_pass_before_move=20 masks Pass out of the
# recorded policy target and the actually-played move for the first 20 moves. Every
# collapse inspected so far (sections 12, 14, 16) happened at or below move 20;
# legitimate games never finish before move 42 (has_suspicious_mid_game_pass's
# docstring) -- so this cannot suppress a real early finish, only the collapse pattern
# itself.

checkpoint_path: checkpoints/bootstrap_batch2_residual.pt
board_size: 9
komi: 7.5
seed: 20260903

num_games: 100
max_moves: 200
num_simulations: 400
temperature: 1.0
temperature_drop_move: 30
no_pass_before_move: 20
max_seconds: null
root_dirichlet_epsilon: 0.25
root_dirichlet_alpha: 0.1

out_path: selfplay_games/self_play_gen1_no_pass_guard.npz
