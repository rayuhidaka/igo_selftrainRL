# Option 3, generation 12 retry at 1000 self-play games. Identical to
# bootstrap_train_option3_gen12_candidate.yaml (same parent gen11, seed, 60s cap, and the
# same batch2 0.05 / gen10 0.10 / gen11 0.15 anchors) except the new-generation 0.70 share is
# split evenly across two 500-game files from the same parent and settings: the original
# gen12 run's and selfplay_self_play_option3_gen12_extra500.yaml's. Each source's weight is
# its total share of samples (see bootstrap.dataset.build_training_loader), so 0.35 + 0.35 is
# equivalent to one merged 1000-game file at 0.70.

board_size: 9
seed: 12
init_from_checkpoint: checkpoints/bootstrap_option3_gen11_candidate.pt
device: auto
augment: true

checkpoint_out: checkpoints/bootstrap_option3_gen12_1000games_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen10.npz
    weight: 0.10
  - path: selfplay_games/self_play_option3_gen11.npz
    weight: 0.15
  - path: selfplay_games/self_play_option3_gen12.npz
    weight: 0.35
  - path: selfplay_games/self_play_option3_gen12_extra500.npz
    weight: 0.35

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_option3_gen12_1000games_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
