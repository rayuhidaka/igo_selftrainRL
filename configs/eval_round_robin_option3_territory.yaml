# igo-app's level ratings re-fit under Japanese-style territory scoring (2026-10-23, igo-app's
# scoring overhaul stage B): the same field and game settings as the shipped ratings
# (eval_round_robin_option3_beginner.yaml -- baseline, gen1-gen11 and the Beginner level), but
# every game is decided by territory scoring at komi 6.5 (eval/match.py's territory_komi) -- the
# nets still search with the area komi 7.5 they were trained on. Writes territory_*.json beside
# the shipped area results, which it doesn't touch. A full replay (no --reuse-existing):
#
#   python -m eval.round_robin --config configs/eval_round_robin_option3_territory.yaml
#
# Hours of games -- run it in a detached tmux session.

territory_komi: 6.5
board_size: 9
komi: 7.5
num_games: 40
num_simulations: 50
temperature: 1.0
temperature_drop_move: 16
seed: 0

anchor: baseline

checkpoints:
  baseline: checkpoints/bootstrap_batch2_residual_v2.pt
  gen1: checkpoints/bootstrap_option3_gen1_candidate.pt
  gen2: checkpoints/bootstrap_option3_gen2_candidate.pt
  gen3: checkpoints/bootstrap_option3_gen3_candidate.pt
  gen4: checkpoints/bootstrap_option3_gen4_300games_candidate.pt
  gen5: checkpoints/bootstrap_option3_gen5_candidate.pt
  gen6: checkpoints/bootstrap_option3_gen6_candidate.pt
  gen7: checkpoints/bootstrap_option3_gen7_candidate.pt
  gen8: checkpoints/bootstrap_option3_gen8_candidate.pt
  gen9: checkpoints/bootstrap_option3_gen9_candidate.pt
  gen10: checkpoints/bootstrap_option3_gen10_candidate.pt
  gen11: checkpoints/bootstrap_option3_gen11_candidate.pt
  beginner:
    path: checkpoints/bootstrap_option3_gen1_candidate.pt
    num_simulations: 8
    temperature: 1.0

out_dir: eval
raw_out_name: territory_round_robin_results.json
elo_out_name: territory_checkpoints_elo.json
