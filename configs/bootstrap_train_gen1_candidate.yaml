# Phase 3's fine-tuning run, v2: continues bootstrap_batch2_residual.pt
# (warm start) on a MIX of its self-play data (self_play_gen1.npz, 7,879
# examples) and the original broad imitation-learning set (batch2.npz,
# 224,730 examples) -- see bootstrap/dataset.py's build_training_loader.
#
# v1 of this config trained on self_play_gen1.npz alone and produced a
# real 40-0 strength win, but fine-tuning in isolation like that turned
# out to be unstable: a second such fine-tune (generation 2) collapsed
# into a real self-play failure mode (see docs/ROADMAP.md's Phase 3) --
# empty-board Pass probability climbing from ~0.01% to 25% within two
# generations. Mixing in the broad, known-good dataset each time anchors
# against that drift while still letting the new self-play batch shape
# training.
#
# data_source's weights are by probability mass per batch, NOT by
# example count -- 50/50 here despite batch2.npz outnumbering
# self_play_gen1.npz by ~28x, so self-play still meaningfully shapes
# gradients instead of being drowned out.
#
# epochs/max_train_seconds recalibrated for the new loader: "one epoch"
# now means one combined-dataset-sized pass (~232k weighted-sampled
# examples, not 7,879), so max_train_seconds (not epochs) is the real
# stopping condition here -- ~65s at this architecture's ~32.5 steps/sec
# (see bootstrap_train_batch2_residual.yaml's own run) targets ~2,000
# steps, comparable self-play exposure to v1's 1,230 pure-self-play
# steps once you account for only half of each batch being self-play.

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_batch2_residual.pt

checkpoint_out: checkpoints/bootstrap_gen1_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.5
  - path: selfplay_games/self_play_gen1.npz
    weight: 0.5

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen1_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 65
