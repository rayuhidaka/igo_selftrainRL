# Phase 3's fine-tuning run, v2: continues bootstrap_batch2_residual.pt
# (warm start) on a MIX of its self-play data (self_play_gen1.npz, 7,879
# examples) and the original broad imitation-learning set (batch2.npz,
# 224,730 examples) -- see bootstrap/dataset.py's build_training_loader.
#
# v1 of this config trained on self_play_gen1.npz alone and produced a
# real 40-0 strength win, but fine-tuning in isolation like that turned
# out to be unstable: a second such fine-tune (generation 2) collapsed
# into a real self-play failure mode (see docs/ROADMAP.md's Phase 3) --
# empty-board Pass probability climbing from ~0.01% to 25% within two
# generations. Mixing in the broad, known-good dataset each time anchors
# against that drift while still letting the new self-play batch shape
# training.
#
# data_source's weights are by probability mass per batch, NOT by
# example count.
#
# v1 (unmixed, self_play_gen1.npz only, 1,230 steps): 40-0 win, but
# caused a real self-play collapse when repeated for generation 2.
# v2 (50/50 mix, 1,785 steps, ~57k self-play draws / ~7.25x oversample):
# stable (pass prob 0.86%), but a statistical wash against the parent
# (1508.2 vs 1491.8) -- self-play signal diluted too much to matter.
# v3 (50/50 mix, 3,472 steps, ~111k self-play draws / ~14x oversample):
# still stable on Pass, but a decisive 40-0 *loss* -- more steps on a
# 50/50 mix made things worse, not better, suggesting the problem isn't
# simply "not enough self-play exposure." Re-training heavily on
# batch2.npz again (already fully converged on by the checkpoint this
# starts from, 495k steps in its own original training) with a freshly
# reset optimizer may itself be introducing drift, independent of the
# self-play data.
# v4 (25/75 mix, 1,658 steps, ~78k self-play draws / ~10x oversample --
# matching v1's original exposure, just with anchor protection this
# time): **the fix.** PROMOTE, 40-0 win against the parent, AND stable
# (pass prob 1.22%, no collapse). Less anchor "tax" per step than 50/50
# left enough room for the self-play signal to actually move the
# network, while still anchoring enough to avoid the drift v1 (no
# anchor at all) suffered. This is the config to carry forward into
# later generations.

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_batch2_residual.pt

checkpoint_out: checkpoints/bootstrap_gen1_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.25
  - path: selfplay_games/self_play_gen1.npz
    weight: 0.75

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen1_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
