# Generation 6's fine-tune, fourth attempt, chained from bootstrap_gen5_no_pass_guard_candidate.pt.
# Three prior attempts (two self-play samples, two fine-tune mixes -- see
# docs/SELF_PLAY_STABILITY.md section 24) all beat the pristine baseline but failed to
# promote against gen5. This attempt keeps the replay-buffer mix from attempt 3 (still
# sound practice) but now trains on self_play_gen6_no_pass_guard.npz's tripled batch (300
# games instead of 100) -- testing self-play data volume per generation as the next likely
# lever, per a root-cause investigation's ranking.

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_gen5_no_pass_guard_candidate.pt

checkpoint_out: checkpoints/bootstrap_gen6_no_pass_guard_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.10
  - path: selfplay_games/self_play_gen4_no_pass_guard.npz
    weight: 0.15
  - path: selfplay_games/self_play_gen5_no_pass_guard.npz
    weight: 0.25
  - path: selfplay_games/self_play_gen6_no_pass_guard.npz
    weight: 0.50

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen6_no_pass_guard_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
