# Re-run of selfplay_self_play_gen1.yaml with the diagnosed pass-collapse fix applied
# (2026-09-04, see docs/SELF_PLAY_STABILITY.md): root_dirichlet_epsilon/alpha turn on
# root exploration noise (excluding Pass -- see MctsConfig.root_dirichlet_epsilon), and
# num_simulations is raised from 100 to 400 so search has real room to correct a bad prior
# instead of just reinforcing it. alpha=0.1, not AlphaZero's 19x19 value of 0.03 -- tuned
# for 9x9's much smaller ~82-action branching factor (measured meaningfully better: 5% vs.
# 10% short/collapsed games at 0.03, smoke-tested at n=20). Same source
# checkpoint/seed/out_path convention as the original gen1 run, purely to isolate the
# effect of this fix on the same starting conditions.

checkpoint_path: checkpoints/bootstrap_batch2_residual.pt
board_size: 9
komi: 7.5
seed: 20260903

num_games: 100
max_moves: 200
num_simulations: 400
temperature: 1.0
max_seconds: null
root_dirichlet_epsilon: 0.25
root_dirichlet_alpha: 0.1

out_path: selfplay_games/self_play_gen1_noise_fix.npz
