# Validation run for the new bootstrap/dataset.py dihedral-symmetry augmentation (see
# igo-app/docs/ROADMAP.md's "weak opening moves" item). Identical to
# bootstrap_train_gen11_no_pass_guard_candidate.yaml in every respect except `augment: true`
# -- same warm start, same data sources/weights, same seed, same budget -- so any opening-move
# difference can be attributed to augmentation alone, not a confound.

board_size: 9
seed: 11
init_from_checkpoint: checkpoints/bootstrap_gen10_no_pass_guard_candidate.pt
device: auto
augment: true

checkpoint_out: checkpoints/bootstrap_gen11_augment_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.05
  - path: selfplay_games/self_play_gen9_no_pass_guard.npz
    weight: 0.10
  - path: selfplay_games/self_play_gen10_no_pass_guard.npz
    weight: 0.15
  - path: selfplay_games/self_play_gen11_no_pass_guard.npz
    weight: 0.70

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen11_augment_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
