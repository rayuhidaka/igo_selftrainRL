# Fine-tunes bootstrap_batch2_residual.pt (warm start) on the self-play batch generated
# with temperature annealing added on top of the noise-based collapse fix (2026-09-04,
# see docs/SELF_PLAY_STABILITY.md section 13): temperature_drop_move=30 switches to
# greedy move selection after move 30, matching AlphaZero's own schedule, instead of a
# flat temperature=1.0 for the whole game. Tests whether this fixes the fine-tune wash
# seen in configs/bootstrap_train_gen1_noise_fix_candidate.yaml (1491.8 vs. parent's
# 1508.2 -- do not promote).
#
# Same 25/75 mix recipe as bootstrap_train_gen1_candidate.yaml's v4 and
# bootstrap_train_gen1_noise_fix_candidate.yaml -- only the self-play source path and
# output names change, to isolate the effect of annealing.

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_batch2_residual.pt

checkpoint_out: checkpoints/bootstrap_gen1_temp_anneal_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.25
  - path: selfplay_games/self_play_gen1_temp_anneal.npz
    weight: 0.75

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen1_temp_anneal_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
