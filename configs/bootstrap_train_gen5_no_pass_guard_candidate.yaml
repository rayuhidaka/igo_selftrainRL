# Generation 5's fine-tune, chained from bootstrap_gen4_no_pass_guard_candidate.pt (warm
# start). Same 25/75 mix recipe as every prior gen1-gen4 candidate: 25% broad anchor
# (batch2.npz), 75% new self-play (self_play_gen5_no_pass_guard.npz).

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_gen4_no_pass_guard_candidate.pt

checkpoint_out: checkpoints/bootstrap_gen5_no_pass_guard_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.25
  - path: selfplay_games/self_play_gen5_no_pass_guard.npz
    weight: 0.75

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen5_no_pass_guard_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
