# Generation 8's self-play data, chained from bootstrap_gen7_no_pass_guard_candidate.pt.
# Same full fix stack as gen1-gen7: root noise excluding Pass (alpha=0.1), temperature
# annealing (temperature_drop_move=30), and the structural no_pass_before_move=20 guard.
# Run via selfplay.run_parallel (not selfplay.self_play directly) to cut wall time.
#
# num_games=300 is the standing recipe since generation 6's plateau investigation --
# see docs/SELF_PLAY_STABILITY.md section 24.
#
# Retry (seed bumped): attempt 1 (seed 20260906) did not promote against gen7 (still beat
# baseline decisively) -- read as ordinary self-play variance, not a new plateau, see
# section 26. Retrying with a fresh self-play sample before concluding anything further.

checkpoint_path: checkpoints/bootstrap_gen7_no_pass_guard_candidate.pt
board_size: 9
komi: 7.5
seed: 314159

num_games: 300
max_moves: 200
num_simulations: 400
temperature: 1.0
temperature_drop_move: 30
no_pass_before_move: 20
max_seconds: null
root_dirichlet_epsilon: 0.25
root_dirichlet_alpha: 0.1

out_path: selfplay_games/self_play_gen8_no_pass_guard.npz
