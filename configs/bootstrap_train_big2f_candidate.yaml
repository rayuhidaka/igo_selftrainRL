# big2f: the big2 fine-tune with big2f's games in place of big2's; nothing else changed.
# Bigger-net chain, generation 2: big1 fine-tuned on its own 2000 fastplay games (cleanup-
# labelled ownership), anchored with the gen11-level games big1 was distilled from. 20 min at
# lr 2e-4 on the RTX 3050. fastplay_benchmark_gen11.npz stays held out.

board_size: 9
seed: 2002
init_from_checkpoint: checkpoints/big10x128_distill_phase2.pt
device: auto
augment: true

checkpoint_out: checkpoints/big2f_candidate.pt
data_source:
  - path: selfplay_games/fastplay_big2f.npz                # big1, 2000 games, fpu_reduction 0.2
    weight: 0.50
  - path: selfplay_games/fastplay_gen11_2000.npz           # gen11, 2000 games
    weight: 0.20
  - path: selfplay_games/self_play_option3_gen12.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen12_extra500.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen12_800sims.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen11.npz
    weight: 0.04
  - path: selfplay_games/self_play_option3_gen10.npz
    weight: 0.03
  - path: selfplay_games/self_play_option3_gen9.npz
    weight: 0.03
  - path: selfplay_games/batch2.npz
    weight: 0.05

batch_size: 256
learning_rate: 0.0002
epochs: 1000

log_dir: runs
run_name: big2f_candidate
log_every_n_steps: 200
checkpoint_interval_steps: 2000

max_train_seconds: 1200
