# Generation 11's fine-tune, chained from bootstrap_gen10_no_pass_guard_candidate.pt (warm
# start). Replay-buffer mix (standing recipe since generation 6, see
# docs/SELF_PLAY_STABILITY.md section 24): a small legacy imitation-data anchor plus a
# weighted window of recent self-play generations, favoring the newest.
#
# device: auto (bootstrap/train.py's resolve_device) picks up the machine's CUDA GPU when
# available -- first generation trained with GPU wiring; self-play/eval stay CPU-only by
# design (see selfplay/self_play.py's module docstring).

board_size: 9
seed: 11
init_from_checkpoint: checkpoints/bootstrap_gen10_no_pass_guard_candidate.pt
device: auto

checkpoint_out: checkpoints/bootstrap_gen11_no_pass_guard_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.05
  - path: selfplay_games/self_play_gen9_no_pass_guard.npz
    weight: 0.10
  - path: selfplay_games/self_play_gen10_no_pass_guard.npz
    weight: 0.15
  - path: selfplay_games/self_play_gen11_no_pass_guard.npz
    weight: 0.70

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen11_no_pass_guard_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
