# Same recipe as configs/bootstrap_train_gen1_candidate.yaml's v4 (25/75
# mix, step count matched to ~10x self-play oversample) -- the one
# proven to be both a real win and stable -- but with has_score_head:
# true, to test whether the auxiliary score-margin head (see
# docs/SELF_PLAY_STABILITY.md section 7) reduces how much a fine-tune
# drifts. Kept as a separate checkpoint from bootstrap_gen1_candidate.pt
# (the v4 baseline) so the two can be compared directly.

board_size: 9
seed: 9
init_from_checkpoint: checkpoints/bootstrap_batch2_residual.pt
has_score_head: true

checkpoint_out: checkpoints/bootstrap_gen1_candidate_score_head.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.25
  - path: selfplay_games/self_play_gen1.npz
    weight: 0.75

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_gen1_candidate_score_head
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
