# Same data as configs/bootstrap_train_batch2.yaml (batch2.npz, 3000
# games / 224,730 examples), against the widened RayZeroNet
# (bootstrap/model.py: 3 conv layers, 64 channels, up from 2/32) -- to
# test whether the original architecture's loss plateau (~3.1-3.6 after
# epoch 25) was a capacity ceiling, not a data ceiling.

board_size: 9
seed: 9

checkpoint_out: checkpoints/bootstrap_batch2_wide.pt
data_source: selfplay_games/batch2.npz

batch_size: 64
learning_rate: 0.001
epochs: 50

log_dir: runs
run_name: bootstrap_batch2_wide
log_every_n_steps: 50
checkpoint_interval_steps: 1000

max_train_seconds: 3600
