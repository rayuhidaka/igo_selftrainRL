# Option 3, generation 5 fine-tune. init_from_checkpoint is gen4's 300-game retry
# candidate (the real parent). Mix ratios shift by one generation from gen4's own
# recipe (batch2 0.05 / gen2 0.10 / gen3 0.15 / gen4-new 0.70): gen2 is dropped, gen3
# takes gen2's old 0.10 slot, gen4_300games takes gen3's old 0.15 slot, gen5-new gets
# the same 0.70 dominant share every generation in this restart has used.

board_size: 9
seed: 5
init_from_checkpoint: checkpoints/bootstrap_option3_gen4_300games_candidate.pt
device: auto
augment: true

checkpoint_out: checkpoints/bootstrap_option3_gen5_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen3.npz
    weight: 0.10
  - path: selfplay_games/self_play_option3_gen4_300games.npz
    weight: 0.15
  - path: selfplay_games/self_play_option3_gen5.npz
    weight: 0.70

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_option3_gen5_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
