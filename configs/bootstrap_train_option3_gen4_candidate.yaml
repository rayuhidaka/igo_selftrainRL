# Option 3, generation 4 fine-tune. init_from_checkpoint is gen3's candidate.
#
# Replay-buffer mix now matches the established deep-chain shape (same pattern as
# gen12's own recipe): a small batch2.npz anchor, the 2-back generation at a modest
# weight, the immediate parent heavier, newest data dominant. gen1 drops out of the
# active mix here (same as the original chain gradually aging out early generations).

board_size: 9
seed: 4
init_from_checkpoint: checkpoints/bootstrap_option3_gen3_candidate.pt
device: auto
augment: true

checkpoint_out: checkpoints/bootstrap_option3_gen4_candidate.pt
data_source:
  - path: selfplay_games/batch2.npz
    weight: 0.05
  - path: selfplay_games/self_play_option3_gen2.npz
    weight: 0.10
  - path: selfplay_games/self_play_option3_gen3.npz
    weight: 0.15
  - path: selfplay_games/self_play_option3_gen4.npz
    weight: 0.70

batch_size: 64
learning_rate: 0.0002
epochs: 1

log_dir: runs
run_name: bootstrap_option3_gen4_candidate
log_every_n_steps: 50
checkpoint_interval_steps: 500

max_train_seconds: 60
