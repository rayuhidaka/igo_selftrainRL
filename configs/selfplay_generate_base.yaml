# Base config for selfplay/generate.py.

katago_tflite_path: ../app/src/main/assets/models/katago_b10c384h6nbttflrs_b9.tflite
board_size: 9
komi: 7.5
seed: 9

num_games: 300
max_moves: 200    # generous cap against a runaway game (double pass_count>=2 usually ends it sooner)
